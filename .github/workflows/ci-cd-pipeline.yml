name: Snapbite CI/CD & Clinical Safety Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Static Code Analysis, Formatting & Linters
  # ============================================================================
  lint-and-format:
    name: 🔍 Lint & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Run ESLint
        run: |
          npm run lint --if-present

  # ============================================================================
  # Stage 2: TypeScript Strict Compilation & Type Check
  # ============================================================================
  type-check:
    name: 🛡️ TypeScript Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Run TypeScript Strict Check (No Emit)
        run: |
          npm run typecheck

  # ============================================================================
  # Stage 3: Automated Unit Tests & Clinical DDI Matrix Regression
  # ============================================================================
  unit-tests:
    name: 🧪 Unit Tests & Clinical Safety Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Execute Jest Unit Test Suite & Coverage
        run: |
          npm test

  # ============================================================================
  # Stage 4: Dependency Vulnerability & Security Audit
  # ============================================================================
  security-audit:
    name: 🔒 Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run NPM Security Audit (High & Critical)
        run: |
          npm audit --audit-level=high || true

  # ============================================================================
  # Stage 5: Build Verification & Bundle Integrity
  # ============================================================================
  build-verification:
    name: 📦 Build Verification
    needs: [lint-and-format, type-check, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Verify Build Artifacts
        run: |
          npm run build
